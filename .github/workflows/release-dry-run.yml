name: Release dry run

on:
  pull_request:
    paths:
      - ".github/workflows/release*.yml"
      - ".goreleaser.yaml"
      - "npm/**"
      - "scripts/npm-publish.js"
      - "scripts/release-smoke.js"
      - "scripts/release-artifacts.js"
      - ".github/tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25"
          cache: false

      - name: Run actionlint
        working-directory: .github/tools
        run: go run github.com/rhysd/actionlint/cmd/actionlint -color "${{ github.workspace }}/.github/workflows"

  build:
    name: GoReleaser snapshot build
    runs-on: ubuntu-latest
    needs: actionlint
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: webui/package-lock.json

      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goreleaser-dist
          path: dist/
          retention-days: 3

  smoke:
    name: Release smoke tests
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-smoke-reusable.yml
    with:
      dist-artifact-name: goreleaser-dist
