name: Release smoke (reusable)

on:
  workflow_call:
    inputs:
      dist-artifact-name:
        description: Artifact name containing the GoReleaser dist/ directory
        required: true
        type: string

jobs:
  smoke-binary:
    name: Binary smoke (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - label: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - label: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Download GoReleaser dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.dist-artifact-name }}
          path: dist

      - name: Smoke test binary
        shell: bash
        run: node scripts/release-smoke.js binary dist ${{ matrix.goos }} ${{ matrix.goarch }}

  smoke-npm:
    name: npm smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Download GoReleaser dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.dist-artifact-name }}
          path: dist

      - name: Smoke test npm package
        shell: bash
        run: node scripts/release-smoke.js npm dist
