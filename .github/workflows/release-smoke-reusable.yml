name: Release smoke (reusable)

on:
  workflow_call:
    inputs:
      dist-artifact-name:
        description: Artifact name containing the GoReleaser dist/ directory
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke-binary:
    name: Binary smoke (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - label: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - label: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Download GoReleaser dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.dist-artifact-name }}
          path: dist

      - name: Smoke test binary
        shell: bash
        env:
          SMOKE_GOOS: ${{ matrix.goos }}
          SMOKE_GOARCH: ${{ matrix.goarch }}
        run: node scripts/release-smoke.js binary dist "$SMOKE_GOOS" "$SMOKE_GOARCH"

  smoke-npm:
    name: npm smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Download GoReleaser dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.dist-artifact-name }}
          path: dist

      - name: Smoke test npm package
        shell: bash
        run: node scripts/release-smoke.js npm dist
